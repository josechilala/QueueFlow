x-staging-api-environment: &staging-api-environment
  ASPNETCORE_ENVIRONMENT: Staging
  DOTNET_ENVIRONMENT: Staging
  ConnectionStrings__QueueFlowDatabase: Host=postgres;Port=5432;Database=queueflow;Username=queueflow;Password=${STAGING_POSTGRES_PASSWORD:?Set STAGING_POSTGRES_PASSWORD in .env.staging};Maximum Pool Size=150;Timeout=120;Command Timeout=180
  Authentication__JwtKey: ${STAGING_AUTHENTICATION_JWT_KEY:?Set STAGING_AUTHENTICATION_JWT_KEY in .env.staging}
  Onboarding__PublicUrl: ${STAGING_CUSTOMER_ORIGIN:-http://localhost:13001}
  Onboarding__VerificationCodePepper: ${STAGING_ONBOARDING_VERIFICATION_CODE_PEPPER:-}
  Redis__ConnectionString: redis:6379
  Redis__UseBackplane: "true"
  Cors__Origins__0: ${STAGING_ADMIN_ORIGIN:-http://localhost:13000}
  Cors__Origins__1: ${STAGING_CUSTOMER_ORIGIN:-http://localhost:13001}
  Cors__Origins__2: ${STAGING_DISPLAY_ORIGIN:-http://localhost:13002}
  Cors__Origins__3: ${STAGING_ATTENDANT_ORIGIN:-http://localhost:13003}
  OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
  OTEL_EXPORTER_OTLP_PROTOCOL: grpc
  RateLimiting__GlobalPermitLimit: "5000"
  RateLimiting__PublicPermitLimit: "2000"
  RateLimiting__AuthPermitLimit: "100"

services:
  postgres:
    command: ["postgres", "-c", "max_connections=250"]
    environment:
      POSTGRES_PASSWORD: ${STAGING_POSTGRES_PASSWORD:?Set STAGING_POSTGRES_PASSWORD in .env.staging}

  migrate:
    environment: *staging-api-environment

  api:
    environment:
      <<: *staging-api-environment
      ASPNETCORE_HTTP_PORTS: 8080
    ports: !override ["${STAGING_API_PORT:-18080}:8080"]

  worker:
    environment: *staging-api-environment

  admin-web:
    build:
      args:
        NEXT_PUBLIC_QUEUEFLOW_API_URL: ${STAGING_API_PUBLIC_URL:-http://localhost:18080}
        NEXT_PUBLIC_QUEUEFLOW_ATTENDANT_URL: ${STAGING_ATTENDANT_ORIGIN:-http://localhost:13003}
        NEXT_PUBLIC_QUEUEFLOW_DISPLAY_URL: ${STAGING_DISPLAY_ORIGIN:-http://localhost:13002}
    environment:
      NODE_ENV: production
      QUEUEFLOW_API_URL: http://api:8080
      NEXT_PUBLIC_QUEUEFLOW_API_URL: ${STAGING_API_PUBLIC_URL:-http://localhost:18080}
      QUEUEFLOW_SECURE_COOKIES: ${STAGING_SECURE_COOKIES:-true}
      QUEUEFLOW_PUBLIC_URL: ${STAGING_ADMIN_ORIGIN:-http://localhost:13000}
      QUEUEFLOW_CUSTOMER_URL: ${STAGING_CUSTOMER_ORIGIN:-http://localhost:13001}
      NEXT_PUBLIC_QUEUEFLOW_ATTENDANT_URL: ${STAGING_ATTENDANT_ORIGIN:-http://localhost:13003}
      NEXT_PUBLIC_QUEUEFLOW_DISPLAY_URL: ${STAGING_DISPLAY_ORIGIN:-http://localhost:13002}
    ports: !override ["${STAGING_ADMIN_PORT:-13000}:3000"]

  customer-web:
    build:
      args:
        NEXT_PUBLIC_QUEUEFLOW_API_URL: ${STAGING_API_PUBLIC_URL:-http://localhost:18080}
        NEXT_PUBLIC_QUEUEFLOW_ADMIN_URL: ${STAGING_ADMIN_ORIGIN:-http://localhost:13000}
    environment:
      NODE_ENV: production
      QUEUEFLOW_API_URL: http://api:8080
      NEXT_PUBLIC_QUEUEFLOW_API_URL: ${STAGING_API_PUBLIC_URL:-http://localhost:18080}
    ports: !override ["${STAGING_CUSTOMER_PORT:-13001}:3000"]

  display-web:
    build:
      args:
        NEXT_PUBLIC_QUEUEFLOW_API_URL: ${STAGING_API_PUBLIC_URL:-http://localhost:18080}
    environment:
      NODE_ENV: production
      QUEUEFLOW_API_URL: http://api:8080
      NEXT_PUBLIC_QUEUEFLOW_API_URL: ${STAGING_API_PUBLIC_URL:-http://localhost:18080}
    ports: !override ["${STAGING_DISPLAY_PORT:-13002}:3000"]

  attendant-web:
    build:
      args:
        NEXT_PUBLIC_QUEUEFLOW_API_URL: ${STAGING_API_PUBLIC_URL:-http://localhost:18080}
    environment:
      NODE_ENV: production
      QUEUEFLOW_API_URL: http://api:8080
      NEXT_PUBLIC_QUEUEFLOW_API_URL: ${STAGING_API_PUBLIC_URL:-http://localhost:18080}
      QUEUEFLOW_SECURE_COOKIES: ${STAGING_SECURE_COOKIES:-true}
      QUEUEFLOW_PUBLIC_URL: ${STAGING_ATTENDANT_ORIGIN:-http://localhost:13003}
    ports: !override ["${STAGING_ATTENDANT_PORT:-13003}:3000"]

  otel-collector:
    ports: !override
      - "${STAGING_OTLP_GRPC_PORT:-14317}:4317"
      - "${STAGING_OTLP_HTTP_PORT:-14318}:4318"

  prometheus:
    ports: !override ["${STAGING_PROMETHEUS_PORT:-19090}:9090"]

  alertmanager:
    ports: !override ["${STAGING_ALERTMANAGER_PORT:-19093}:9093"]

  load-test:
    profiles: ["load"]
    build:
      context: .
      dockerfile: tests/QueueFlow.LoadTests/Dockerfile
    environment:
      QUEUEFLOW_API_URL: http://api:8080
    depends_on:
      api: { condition: service_healthy }
