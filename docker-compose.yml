services:
  api:
    build:
      context: .
      dockerfile: src/QueueFlow.Api/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_HTTP_PORTS: 8080
      ConnectionStrings__QueueFlowDatabase: Host=postgres;Port=5432;Database=queueflow;Username=queueflow;Password=${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy

  admin-web:
    build: { context: ., dockerfile: apps/admin-web/Dockerfile }
    ports: ["3000:3000"]

  customer-web:
    build: { context: ., dockerfile: apps/customer-web/Dockerfile }
    ports: ["3001:3000"]

  display-web:
    build: { context: ., dockerfile: apps/display-web/Dockerfile }
    ports: ["3002:3000"]

  redis:
    image: redis:8-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes: ["queueflow-redis:/data"]

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: queueflow
      POSTGRES_USER: queueflow
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - queueflow-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U queueflow -d queueflow"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  queueflow-postgres:
  queueflow-redis:
