# Separate database and volume. No production or existing development data is reused.
services:
  billing-postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: queueflow_billing_dev
      POSTGRES_USER: queueflow_billing_dev
      POSTGRES_PASSWORD: ${BILLING_DEV_POSTGRES_PASSWORD:?Configure a development-only password}
    volumes:
      - billing-dev-postgres:/var/lib/postgresql/data
volumes:
  billing-dev-postgres:
